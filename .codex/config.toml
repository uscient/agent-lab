# Codex project config — for an agent DEVELOPING Agent Lab (control plane).
# Autonomy inside the AGENTS.md boundary; NEVER a global bypass.
# Do NOT use --yolo / --dangerously-bypass-approvals-and-sandbox / danger-full-access /
# codex exec --full-auto / --ignore-rules (see docs/agent-config.md).

approval_policy = "on-request"      # work inside the sandbox without prompts; ask to cross the boundary
sandbox_mode    = "workspace-write" # read repo, edit workspace, run local commands
web_search      = "disabled"        # repository workflow uses Git/GitHub tools, not web search

[features]
hooks = true

[sandbox_workspace_write]
# Network supports fetch, same-branch push, and PR creation. The guard, repository branch
# protection, and AGENTS.md keep protected branches, auth, and integration mutations out of scope.
network_access = true

[mcp_servers.serena]
startup_timeout_sec = 60
tool_timeout_sec = 240
command = "env"
args = ["-u", "BASH_ENV", "-u", "ENV", "bash", "--noprofile", "--norc", "-c", "root=\"$(git rev-parse --show-toplevel)\" && exec \"$root/scripts/serena-mcp\" --context=codex"]
